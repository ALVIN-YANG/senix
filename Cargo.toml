[workspace]
members = [
    "crates/senix-acme",
    "crates/senix-core",
    "crates/senix-mcp",
    "crates/senix-pingora",
    "crates/senixd",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.9"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1.12"
chacha20poly1305 = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
hmac = "0.13"
h2 = "0.4"
http = "1.3"
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
openssl = { version = "0.10", features = ["vendored"] }
parking_lot = "0.12"
pingora-core = { version = "0.8.1", features = ["openssl"] }
pingora-http = "0.8.1"
pingora-proxy = { version = "0.8.1", features = ["openssl"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
senix-core = { path = "crates/senix-core" }
senix-acme = { path = "crates/senix-acme" }
senix-mcp = { path = "crates/senix-mcp" }
senix-pingora = { path = "crates/senix-pingora" }
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-openssl = "0.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.19", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
