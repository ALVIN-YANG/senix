<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
  <title id="title">AI 配置变更流程</title>
  <desc id="desc">AI 读取当前配置并提出不可修改的计划，Owner 核对并批准精确内容，AI 应用后使用真实请求验证。未批准或基线已过期的计划会被拒绝。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d9c83"/></marker></defs>
  <rect width="720" height="580" rx="20" fill="#edf3f2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="36" y="51" fill="#173a45" font-size="32" font-weight="700">AI 能操作，人掌握批准权</text>
    <g transform="translate(36 80)">
      <rect width="648" height="116" rx="12" fill="#fff" stroke="#d5dfdc"/>
      <circle cx="37" cy="36" r="19" fill="#173a45"/><text x="37" y="45" text-anchor="middle" fill="#fff" font-size="25">1</text>
      <text x="72" y="45" fill="#173a45" font-size="28" font-weight="700">AI 读取 → 规划</text>
      <text x="26" y="88" fill="#526a70" font-size="25">保留其他路由，核对配置基线版本</text>
    </g>
    <path d="M360 200 V226" stroke="#2d9c83" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(36 236)">
      <rect width="648" height="116" rx="12" fill="#173a45"/>
      <circle cx="37" cy="36" r="19" fill="#65d4b6"/><text x="37" y="45" text-anchor="middle" fill="#173a45" font-size="25">2</text>
      <text x="72" y="45" fill="#fff" font-size="28" font-weight="700">Owner 核对 → 批准</text>
      <text x="26" y="88" fill="#d7e5e1" font-size="25">批准绑定精确内容，有效期 15 分钟</text>
    </g>
    <path d="M360 356 V382" stroke="#2d9c83" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(36 392)">
      <rect width="648" height="116" rx="12" fill="#fff" stroke="#2d9c83"/>
      <circle cx="37" cy="36" r="19" fill="#2d9c83"/><text x="37" y="45" text-anchor="middle" fill="#fff" font-size="25">3</text>
      <text x="72" y="45" fill="#173a45" font-size="28" font-weight="700">AI 应用 → 真实请求验证</text>
      <text x="26" y="88" fill="#526a70" font-size="25">新快照、变更路由、无关路由都要检查</text>
    </g>
    <text x="36" y="551" fill="#526a70" font-size="23">未批准 / 计划过期 / 基线变化 → 拒绝应用</text>
  </g>
</svg>
