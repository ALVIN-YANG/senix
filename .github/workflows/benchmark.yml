name: Reproducible benchmark

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload to measure
        type: choice
        options: [short-http, paced-sse]
        default: short-http

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build release image
        run: docker build -t senix:benchmark .
      - name: Pull pinned load generator and backend
        run: |
          docker pull grafana/k6:2.3.0
          docker pull node:24-bookworm-slim
      - name: Measure real proxy paths
        if: inputs.workload != 'paced-sse'
        run: python3 benchmarks/run.py --image senix:benchmark --output target/benchmarks
      - name: Measure incremental SSE delivery
        if: inputs.workload == 'paced-sse'
        run: python3 benchmarks/streaming.py --image senix:benchmark --output target/benchmarks
      - name: Preserve measurements even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-${{ github.sha }}
          path: target/benchmarks/
          if-no-files-found: warn
