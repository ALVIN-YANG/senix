name: Security

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # audit-check reports advisories as issues but can succeed for already-reported findings.
      # Always gate on cargo-audit's exit status, including yanked locked dependencies.
      - name: Reject vulnerable or yanked dependencies
        if: always()
        run: cargo audit --deny yanked
