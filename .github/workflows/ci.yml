name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake clang perl pkg-config libssl-dev
      - name: Build embedded admin
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Verify embedded admin is current
        run: git diff --exit-code -- crates/senixd/assets
      - name: Verify delivery files
        run: |
          sh -n install.sh scripts/*.sh
          docker compose --file examples/demo/compose.yml config --quiet
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
