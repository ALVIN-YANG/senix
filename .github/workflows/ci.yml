name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake clang perl pkg-config libssl-dev
      - name: Build embedded admin
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Audit admin dependencies
        working-directory: web
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - name: Verify embedded admin is current
        run: git diff --exit-code -- crates/senixd/assets
      - name: Verify delivery files
        run: |
          sh -n install.sh scripts/*.sh
          docker compose --file examples/demo/compose.yml config --quiet
          SENIX_METRICS_KEY_FILE=/dev/null docker compose --file examples/observability/compose.yml --profile collectors config --quiet
          python3 -m py_compile benchmarks/run.py benchmarks/report.py scripts/check-observability.py scripts/check-demo.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify Docker demo failure recovery
        id: demo
        timeout-minutes: 5
        run: |
          docker compose --file examples/demo/compose.yml pull
          python3 scripts/check-demo.py --startup-failure --output target/demo-ci
      - name: Preserve failed demo evidence
        if: failure() && steps.demo.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-acceptance-${{ github.sha }}
          path: target/demo-ci/
          if-no-files-found: warn
