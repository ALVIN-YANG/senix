# Attach to a running examples/demo stack. See docs/observability.md.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["127.0.0.1:${SENIX_PROMETHEUS_PORT:-19090}:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${SENIX_METRICS_KEY_FILE:?Set an absolute path to the metrics.read key file}:/run/secrets/senix_metrics_key:ro
  grafana:
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    ports: ["127.0.0.1:${SENIX_GRAFANA_PORT:-13000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/senix.json:/var/lib/grafana/dashboards/senix.json:ro
  otel-collector:
    profiles: ["collectors"]
    image: otel/opentelemetry-collector-contrib:0.162.0
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yml"]
    ports: ["127.0.0.1:18889:8889"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
      - ${SENIX_METRICS_KEY_FILE}:/run/secrets/senix_metrics_key:ro
  victoriametrics:
    profiles: ["collectors"]
    image: victoriametrics/victoria-metrics:v1.154.0
    mem_limit: 512m
    command: ["-promscrape.config=/etc/victoriametrics/scrape.yml", "-retentionPeriod=2d"]
    ports: ["127.0.0.1:18428:8428"]
    volumes:
      - ./victoriametrics.yml:/etc/victoriametrics/scrape.yml:ro
      - ${SENIX_METRICS_KEY_FILE}:/run/secrets/senix_metrics_key:ro
  alloy:
    profiles: ["collectors"]
    image: grafana/alloy:v1.20.1
    mem_limit: 512m
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${SENIX_METRICS_KEY_FILE}:/run/secrets/senix_metrics_key:ro
      - ${SENIX_LOG_DIR:-../../target/observability-logs}:/var/log/senix:ro
  loki:
    profiles: ["collectors"]
    image: grafana/loki:3.7.8
    mem_limit: 512m
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:13100:3100"]
networks:
  default:
    external: true
    name: ${SENIX_DOCKER_NETWORK:-demo_senix-demo}
